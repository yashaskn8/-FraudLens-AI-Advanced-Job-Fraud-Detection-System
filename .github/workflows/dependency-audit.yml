name: Dependency vulnerability audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.audit.outputs.matrix }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker runtime Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pip-audit==2.10.1

      - id: audit
        name: Run pip-audit
        shell: bash
        run: |
          set +e
          pip-audit -r requirements.txt --format json --output audit.json
          audit_status=$?
          set -e
          python - "$audit_status" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          audit_status = int(sys.argv[1])
          report_path = Path("audit.json")
          findings = []
          if report_path.exists():
              report = json.loads(report_path.read_text())
              dependencies = report.get("dependencies", report) if isinstance(report, dict) else report
              for dependency in dependencies:
                  for vulnerability in dependency.get("vulns", []):
                      package = f"{dependency['name']}=={dependency['version']}"
                      vulnerability_id = vulnerability["id"]
                      aliases = ", ".join(vulnerability.get("aliases", [])) or "none"
                      fixes = ", ".join(vulnerability.get("fix_versions", [])) or "none published"
                      findings.append(
                          f"{package}: {vulnerability_id} (aliases: {aliases}; fixes: {fixes})"
                      )

          if not findings:
              if audit_status == 0:
                  findings = ["No known vulnerabilities found"]
              else:
                  findings = ["pip-audit failed before producing a vulnerability report"]

          matrix = {
              "include": [
                  {"finding": finding[:240], "audit_status": audit_status}
                  for finding in findings
              ]
          }

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              print("matrix<<EOF", file=output)
              print(json.dumps(matrix), file=output)
              print("EOF", file=output)
          PY

  enforce-audit:
    needs: pip-audit
    if: always()
    name: "pip-audit: ${{ matrix.finding }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.pip-audit.outputs.matrix) }}
    steps:
      - name: Enforce pip-audit result
        env:
          AUDIT_STATUS: ${{ matrix.audit_status }}
          FINDINGS: ${{ matrix.finding }}
        run: |
          echo "$FINDINGS"
          test "$AUDIT_STATUS" -eq 0
