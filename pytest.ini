[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# ``phoenix`` is a globally installed plugin in some developer environments, but
# its optional dependencies can be incompatible with this project. Disabling it
# here happens before third-party plugin discovery; conftest.py would be too late.
addopts = -p no:phoenix -p no:asyncio -p no:pytest_cov -p no:timeout -p pytest_asyncio.plugin -p pytest_cov -p pytest_timeout -ra --strict-markers --timeout=15 --cov=backend/services --cov-report=term-missing --cov-fail-under=85

[coverage:run]
source = backend/services

[coverage:report]
show_missing = True
fail_under = 85
